<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TFC Anvil · Calculator</title>
    <style>
        /* Reset & Base */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            background: #0f0f11;
            background-image: 
                radial-gradient(ellipse at 20% 50%, rgba(40, 45, 50, 0.3) 0%, transparent 60%),
                radial-gradient(ellipse at 80% 50%, rgba(40, 45, 50, 0.2) 0%, transparent 60%);
            color: #d0d4dc;
            font-family: 'Segoe UI', 'Inter', -apple-system, system-ui, sans-serif;
            display: flex;
            justify-content: center;
            padding: 2rem 1rem;
        }

        .app {
            max-width: 960px;
            width: 100%;
        }

        /* Header */
        .header {
            text-align: center;
            padding: 1.8rem 0 2.2rem;
            position: relative;
        }

        .header::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 120px;
            height: 2px;
            background: linear-gradient(90deg, transparent, #6a7a7a, transparent);
        }

        .header h1 {
            font-weight: 300;
            font-size: 2.4rem;
            letter-spacing: 4px;
            color: #d8dde6;
            text-shadow: 0 2px 8px rgba(0,0,0,0.5);
        }

        .header h1 span {
            font-weight: 600;
            color: #a8b8b8;
        }

        .header .sub {
            font-size: 0.8rem;
            color: #6a7a7a;
            letter-spacing: 6px;
            margin-top: 6px;
            text-transform: uppercase;
        }

        /* Cards */
        .card {
            background: rgba(22, 24, 28, 0.85);
            backdrop-filter: blur(4px);
            border: 1px solid rgba(60, 70, 80, 0.35);
            border-radius: 14px;
            padding: 1.8rem 2rem;
            margin-bottom: 1.8rem;
            box-shadow: 
                0 8px 32px rgba(0,0,0,0.45),
                inset 0 1px 0 rgba(120, 140, 160, 0.08);
            transition: border-color 0.3s;
        }

        .card:hover {
            border-color: rgba(80, 100, 120, 0.5);
        }

        .card-title {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 3px;
            color: #6a7a8a;
            margin-bottom: 1.2rem;
            font-weight: 400;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .card-title .line {
            flex: 1;
            height: 1px;
            background: linear-gradient(90deg, rgba(60, 80, 100, 0.3), transparent);
        }

        /* Emoji Strip */
        .emoji-strip {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 6px;
            background: rgba(16, 18, 22, 0.6);
            border: 1px solid rgba(60, 70, 80, 0.2);
            border-radius: 40px;
            padding: 8px 16px;
            margin-bottom: 1.8rem;
            min-height: 52px;
            align-items: center;
        }

        .emoji-strip .empty {
            color: #4a5a5a;
            font-size: 0.8rem;
            letter-spacing: 1px;
        }

        .emoji-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 4px 14px 4px 10px;
            border-radius: 30px;
            background: rgba(40, 48, 56, 0.5);
            border: 1px solid rgba(60, 80, 100, 0.15);
            cursor: pointer;
            transition: all 0.2s;
            font-size: 1.2rem;
            color: #b0bcc8;
        }

        .emoji-badge:hover {
            background: rgba(50, 60, 72, 0.6);
            border-color: rgba(80, 120, 160, 0.3);
            transform: translateY(-1px);
            box-shadow: 0 4px 16px rgba(0,0,0,0.3);
        }

        .emoji-badge .tooltip {
            font-size: 0.7rem;
            color: #7a8a9a;
            font-weight: 300;
            max-width: 100px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* Inputs & Selects */
        label {
            display: block;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: #6a7a8a;
            margin-bottom: 4px;
            font-weight: 400;
        }

        input, select {
            width: 100%;
            padding: 10px 14px;
            background: rgba(12, 14, 18, 0.7);
            border: 1px solid rgba(50, 65, 80, 0.3);
            border-radius: 8px;
            color: #d0d8e0;
            font-size: 0.95rem;
            transition: all 0.25s;
            outline: none;
            font-family: inherit;
        }

        input:focus, select:focus {
            border-color: rgba(80, 140, 180, 0.5);
            background: rgba(16, 20, 26, 0.8);
            box-shadow: 0 0 0 3px rgba(60, 120, 160, 0.08);
        }

        input::placeholder {
            color: #4a5a6a;
        }

        select option {
            background: #1a1e24;
            color: #d0d8e0;
        }

        /* Rules Grid */
        .rules-grid {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 6px;
        }

        .rule-row {
            display: flex;
            gap: 10px;
            align-items: center;
            background: rgba(12, 14, 18, 0.3);
            border-radius: 8px;
            padding: 6px 10px 6px 14px;
            border: 1px solid rgba(50, 65, 80, 0.12);
        }

        .rule-row .pos {
            font-size: 0.7rem;
            color: #4a5a6a;
            min-width: 28px;
            font-weight: 300;
            letter-spacing: 0.5px;
        }

        .rule-row select {
            padding: 7px 10px;
            font-size: 0.85rem;
            background: rgba(8, 10, 14, 0.5);
            border-color: rgba(50, 65, 80, 0.15);
        }

        .rule-row select:focus {
            border-color: rgba(80, 140, 180, 0.4);
        }

        /* Button */
        .btn-primary {
            width: 100%;
            padding: 14px;
            margin-top: 1.5rem;
            font-size: 0.95rem;
            font-weight: 500;
            letter-spacing: 2px;
            text-transform: uppercase;
            background: linear-gradient(135deg, rgba(40, 60, 80, 0.6), rgba(30, 45, 60, 0.4));
            border: 1px solid rgba(60, 90, 120, 0.25);
            border-radius: 10px;
            color: #b0c8d8;
            cursor: pointer;
            transition: all 0.3s;
            font-family: inherit;
        }

        .btn-primary:hover {
            background: linear-gradient(135deg, rgba(50, 80, 110, 0.5), rgba(40, 60, 80, 0.3));
            border-color: rgba(80, 140, 180, 0.35);
            transform: translateY(-1px);
            box-shadow: 0 6px 24px rgba(0, 20, 40, 0.3);
            color: #d0dce8;
        }

        .btn-primary:active {
            transform: translateY(0);
        }

        /* Result */
        .result-panel {
            background: rgba(10, 12, 16, 0.6);
            border-radius: 10px;
            padding: 1.2rem 1.5rem;
            border-left: 3px solid rgba(80, 140, 180, 0.25);
            min-height: 60px;
        }

        .result-success {
            color: #8ab8b0;
            font-size: 0.95rem;
        }

        .result-success strong {
            color: #b0d0d0;
            font-weight: 500;
        }

        .result-hits {
            color: #6a8a8a;
            font-size: 0.85rem;
            margin: 6px 0 12px;
        }

        .result-steps {
            background: rgba(6, 8, 12, 0.4);
            border-radius: 8px;
            padding: 10px 14px;
            border: 1px solid rgba(50, 65, 80, 0.1);
        }

        .step-line {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 3px 0;
            font-size: 0.9rem;
        }

        .step-number {
            color: #4a5a6a;
            min-width: 32px;
            font-size: 0.75rem;
            font-weight: 300;
            letter-spacing: 0.5px;
        }

        .step-image {
            display: inline-flex;
            align-items: center;
        }

        .step-image img {
            width: 28px;
            height: 28px;
            object-fit: contain;
            image-rendering: pixelated;
            background: rgba(10, 14, 20, 0.5);
            border-radius: 4px;
            padding: 2px;
            border: 1px solid rgba(50, 65, 80, 0.12);
        }

        .step-name {
            color: #b8c4d0;
            font-weight: 300;
        }

        .result-error {
            color: #b08070;
            padding: 10px 0;
        }

        /* Save Area */
        .save-area {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 10px;
            margin-top: 1.2rem;
            padding-top: 1.2rem;
            border-top: 1px solid rgba(50, 65, 80, 0.12);
        }

        .save-area input {
            flex: 1;
            min-width: 100px;
            padding: 8px 12px;
            font-size: 0.85rem;
        }

        .save-area input#craftEmoji {
            flex: 0 0 60px;
            min-width: 60px;
            text-align: center;
            font-size: 1.2rem;
        }

        .btn-save {
            padding: 8px 24px;
            background: rgba(40, 60, 80, 0.3);
            border: 1px solid rgba(60, 90, 120, 0.2);
            border-radius: 8px;
            color: #8aa8b8;
            cursor: pointer;
            transition: all 0.25s;
            font-size: 0.8rem;
            letter-spacing: 1px;
            text-transform: uppercase;
            font-family: inherit;
            font-weight: 400;
        }

        .btn-save:hover {
            background: rgba(50, 80, 110, 0.3);
            border-color: rgba(80, 140, 180, 0.3);
            color: #b0c8d8;
        }

        .save-feedback {
            font-size: 0.75rem;
            color: #5a7a7a;
            margin-top: 4px;
            width: 100%;
            text-align: center;
        }

        /* Scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(10, 12, 16, 0.3);
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(60, 80, 100, 0.3);
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(80, 100, 120, 0.4);
        }

        /* Responsive */
        @media (max-width: 640px) {
            .card {
                padding: 1.2rem 1rem;
            }
            .header h1 {
                font-size: 1.6rem;
                letter-spacing: 2px;
            }
            .rule-row {
                flex-wrap: wrap;
                padding: 8px 10px;
            }
            .rule-row select {
                flex: 1;
                min-width: 80px;
            }
            .save-area {
                flex-direction: column;
                align-items: stretch;
            }
            .save-area input#craftEmoji {
                flex: 1;
                min-width: auto;
            }
            .btn-save {
                width: 100%;
            }
            .step-image img {
                width: 24px;
                height: 24px;
            }
        }

        @media (max-width: 400px) {
            .rule-row .pos {
                display: none;
            }
            .emoji-strip {
                gap: 4px;
                padding: 6px 10px;
            }
            .emoji-badge {
                font-size: 1rem;
                padding: 2px 10px 2px 6px;
            }
            .emoji-badge .tooltip {
                display: none;
            }
        }
    </style>
</head>
<body>

<div class="app">

    <!-- Header -->
    <header class="header">
        <h1>⚙️ <span>ANVIL</span> · CALC</h1>
        <div class="sub">TerraFirmaCraft · Forge</div>
    </header>

    <!-- Emoji Strip -->
    <div id="emojiStrip" class="emoji-strip">
        <span class="empty">⏳ nenhum craft salvo</span>
    </div>

    <!-- Main Card -->
    <div class="card">
        <div class="card-title">
            <span>🎯 Target</span>
            <span class="line"></span>
        </div>
        <input id="target" type="number" value="112">

        <div class="card-title" style="margin-top:1.8rem;">
            <span>⛓️ Constraints · last 3 steps</span>
            <span class="line"></span>
        </div>

        <div class="rules-grid" id="rules"></div>

        <button class="btn-primary" onclick="calculate()">⟳ Calculate</button>
    </div>

    <!-- Result Card -->
    <div class="card">
        <div class="card-title">
            <span>📋 Result</span>
            <span class="line"></span>
        </div>

        <div class="result-panel" id="resultContainer">
            <div id="output" style="color:#5a6a7a; font-size:0.85rem; padding:4px 0;">
                ⚡ aguardando cálculo...
            </div>
        </div>

        <!-- Save Area -->
        <div class="save-area">
            <input id="craftName" placeholder="Nome do craft" value="Meu craft">
            <input id="craftEmoji" placeholder="⚔️" value="⚔️">
            <button class="btn-save" onclick="saveCraft()">💾 Salvar</button>
            <div class="save-feedback" id="saveFeedback"></div>
        </div>
    </div>

</div>

<script>
    // ------------------------------------------------------------
    //  AÇÕES E REGRAS
    // ------------------------------------------------------------
    const actions = [
        { name: "Light Hit", value: -3 },
        { name: "Medium Hit", value: -6 },
        { name: "Hard Hit", value: -9 },
        { name: "Draw", value: -15 },
        { name: "Punch", value: 2 },
        { name: "Bend", value: 7 },
        { name: "Upset", value: 13 },
        { name: "Shrink", value: 16 },
    ];

    const imageMap = {
        "Light Hit": "hit_light",
        "Medium Hit": "hit_medium",
        "Hard Hit": "hit_hard",
        "Draw": "draw",
        "Punch": "punch",
        "Bend": "bend",
        "Upset": "upset",
        "Shrink": "shrink"
    };

    const hitActions = ["Light Hit", "Medium Hit", "Hard Hit"];
    const modes = ["Any", "Last", "Not Last"];
    const names = actions.map(a => a.name);
    const allActions = ["Any Hit", ...names];

    // ------------------------------------------------------------
    //  INJECT RULES UI
    // ------------------------------------------------------------
    const rulesDiv = document.getElementById("rules");
    for (let i = 0; i < 3; i++) {
        let html = `
            <div class="rule-row">
                <span class="pos">${i+1}º</span>
                <select id="action${i}">
                    <option value="">Nenhum</option>
                    ${allActions.map(n => `<option>${n}</option>`).join("")}
                </select>
                <select id="mode${i}">
                    ${modes.map(m => `<option>${m}</option>`).join("")}
                </select>
            </div>
        `;
        rulesDiv.innerHTML += html;
    }

    // ------------------------------------------------------------
    //  LÓGICA DE VALIDAÇÃO (obey)
    // ------------------------------------------------------------
    function obey(path) {
        const rules = [];
        for (let i = 0; i < 3; i++) {
            const act = document.getElementById("action" + i).value;
            if (act === "") continue;
            rules.push({
                position: i,
                action: act,
                mode: document.getElementById("mode" + i).value
            });
        }
        if (rules.length === 0) return true;

        const lastThree = path.slice(-3);
        if (lastThree.length < 3) return false;
        const reversed = [...lastThree].reverse();

        for (const r of rules) {
            const actionAtPosition = reversed[r.position];
            if (r.action === "Any Hit") {
                if (!hitActions.includes(actionAtPosition)) return false;
            } else {
                if (actionAtPosition !== r.action) return false;
                if (r.position === 0) {
                    if (r.mode === "Last" && actionAtPosition !== r.action) return false;
                    if (r.mode === "Not Last" && actionAtPosition === r.action) return false;
                }
            }
        }
        return true;
    }

    // ------------------------------------------------------------
    //  RENDER STEP
    // ------------------------------------------------------------
    function renderStep(stepNumber, actionName) {
        const imageName = imageMap[actionName] || actionName.toLowerCase().replace(/ /g, '_');
        return `
            <div class="step-line">
                <span class="step-number">${String(stepNumber).padStart(2, ' ')}.</span>
                <span class="step-image">
                    <img src="${imageName}.png" 
                         alt="${actionName}" 
                         onerror="this.style.display='none'; this.nextElementSibling.style.display='inline';">
                    <span style="display:none;">${actionName}</span>
                </span>
                <span class="step-name">${actionName}</span>
            </div>
        `;
    }

    // ------------------------------------------------------------
    //  CALCULATE
    // ------------------------------------------------------------
    function calculate() {
        const target = parseInt(document.getElementById("target").value);
        const start = 0;
        let bestSolution = null;
        let minSteps = Infinity;

        for (let maxDepth = 1; maxDepth <= 40; maxDepth++) {
            const queue = [{ value: start, path: [] }];
            const visited = new Set();
            visited.add(start + "|");

            while (queue.length) {
                const node = queue.shift();
                if (node.value === target && obey(node.path)) {
                    if (node.path.length < minSteps) {
                        minSteps = node.path.length;
                        bestSolution = node;
                    }
                }
                if (node.path.length >= maxDepth) continue;

                for (const a of actions) {
                    const nextValue = node.value + a.value;
                    if (nextValue < -100 || nextValue > 250) continue;
                    const nextPath = [...node.path, a.name];
                    const key = nextValue + "|" + nextPath.slice(-3).join(",");
                    if (visited.has(key)) continue;
                    visited.add(key);
                    queue.push({ value: nextValue, path: nextPath });
                }
            }

            if (bestSolution) break;
        }

        const output = document.getElementById("output");
        if (!bestSolution) {
            output.innerHTML = '<div class="result-error">⛔ Nenhuma solução encontrada.</div>';
            return;
        }

        const sol = bestSolution;
        let html = `
            <div class="result-success">
                ✅ Solução com <strong>${sol.path.length}</strong> passos
                <span style="margin-left:16px; color:#6a8a8a;">🎯 ${sol.value}</span>
            </div>
        `;

        const lightHits = sol.path.filter(p => p === "Light Hit").length;
        const mediumHits = sol.path.filter(p => p === "Medium Hit").length;
        const hardHits = sol.path.filter(p => p === "Hard Hit").length;
        if (lightHits + mediumHits + hardHits > 0) {
            html += `<div class="result-hits">⚡ Light=${lightHits} · Medium=${mediumHits} · Hard=${hardHits}</div>`;
        }

        html += `<div class="result-steps">`;
        sol.path.forEach((p, i) => {
            html += renderStep(i + 1, p);
        });
        html += `</div>`;

        output.innerHTML = html;
        window._lastSolution = sol;
    }

    // ------------------------------------------------------------
    //  CRAFTS STORAGE
    // ------------------------------------------------------------
    function loadCrafts() {
        try {
            return JSON.parse(localStorage.getItem('tfc_crafts')) || [];
        } catch { return []; }
    }

    function saveCrafts(crafts) {
        localStorage.setItem('tfc_crafts', JSON.stringify(crafts));
    }

    function renderEmojiStrip() {
        const strip = document.getElementById('emojiStrip');
        const crafts = loadCrafts();
        if (crafts.length === 0) {
            strip.innerHTML = '<span class="empty">⏳ nenhum craft salvo</span>';
            return;
        }
        strip.innerHTML = crafts.map((c, idx) => {
            const emoji = c.emoji || '📦';
            const name = c.name || 'sem nome';
            return `<span class="emoji-badge" data-index="${idx}" title="${name}">
                        ${emoji}
                        <span class="tooltip">${name}</span>
                    </span>`;
        }).join('');

        document.querySelectorAll('.emoji-badge').forEach(el => {
            el.addEventListener('click', function() {
                const idx = parseInt(this.dataset.index);
                showCraftActions(idx);
            });
        });
    }

    function showCraftActions(index) {
        const crafts = loadCrafts();
        const craft = crafts[index];
        if (!craft) return;

        const name = craft.name || 'sem nome';
        const emoji = craft.emoji || '📦';

        const action = prompt(
            `🧰 ${emoji} ${name}\n\n1 - Carregar\n2 - Renomear\n3 - Excluir`,
            '1'
        );
        if (action === null) return;

        if (action === '1') {
            if (craft.target !== undefined) document.getElementById('target').value = craft.target;
            if (craft.rules && Array.isArray(craft.rules)) {
                for (let i = 0; i < 3; i++) {
                    const selAction = document.getElementById('action' + i);
                    const selMode = document.getElementById('mode' + i);
                    if (i < craft.rules.length) {
                        selAction.value = craft.rules[i].action || '';
                        selMode.value = craft.rules[i].mode || 'Any';
                    } else {
                        selAction.value = '';
                        selMode.value = 'Any';
                    }
                }
            }
            document.getElementById('craftName').value = craft.name || '';
            document.getElementById('craftEmoji').value = craft.emoji || '⚔️';
            calculate();
            document.getElementById('saveFeedback').textContent = `✅ "${name}" carregado`;
        } else if (action === '2') {
            const newName = prompt('Novo nome:', name);
            if (newName && newName.trim() !== '') {
                const newEmoji = prompt('Novo emoji:', emoji);
                crafts[index].name = newName.trim();
                if (newEmoji && newEmoji.trim() !== '') crafts[index].emoji = newEmoji.trim();
                saveCrafts(crafts);
                renderEmojiStrip();
                document.getElementById('saveFeedback').textContent = `✏️ renomeado para "${newName.trim()}"`;
            }
        } else if (action === '3') {
            if (confirm(`Excluir "${name}"?`)) {
                crafts.splice(index, 1);
                saveCrafts(crafts);
                renderEmojiStrip();
                document.getElementById('saveFeedback').textContent = `🗑️ "${name}" excluído`;
            }
        }
    }

    function saveCraft() {
        const name = document.getElementById('craftName').value.trim() || 'Sem nome';
        const emoji = document.getElementById('craftEmoji').value.trim() || '📦';
        const target = parseInt(document.getElementById('target').value) || 0;

        const rules = [];
        for (let i = 0; i < 3; i++) {
            const act = document.getElementById('action' + i).value;
            if (act === '') continue;
            rules.push({ action: act, mode: document.getElementById('mode' + i).value });
        }

        const crafts = loadCrafts();
        const existing = crafts.findIndex(c => c.name === name);
        if (existing !== -1) {
            if (!confirm(`Já existe "${name}". Sobrescrever?`)) return;
            crafts[existing] = { name, emoji, target, rules };
        } else {
            crafts.push({ name, emoji, target, rules });
        }
        saveCrafts(crafts);
        renderEmojiStrip();
        document.getElementById('saveFeedback').textContent = `💾 "${name}" salvo (${crafts.length} total)`;
    }

    // ------------------------------------------------------------
    //  INIT
    // ------------------------------------------------------------
    renderEmojiStrip();
    window.onload = calculate;
    window.calculate = calculate;
    window.saveCraft = saveCraft;
</script>

</body>
</html>
